<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LYWSD03MMC 温湿度监视器</title>
    <link rel="shortcut icon" href="../..//img/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        temp: '#ef4444',
                        humi: '#0ea5e9',
                        battery: '#22c55e',
                        dark: '#0f172a',
                        card: '#1e293b',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #0f172a, #111827);
            min-height: 100vh;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .value-animate {
            transition: all 0.3s ease;
        }
        .btn-hover {
            transition: all 0.25s ease;
        }
        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(59,130,246,0.25);
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            opacity: 1;
        }
    </style>
</head>
<body class="text-slate-100 p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <!-- 头部标题 -->
        <header class="text-center mb-8">
            <h1 class="text-[clamp(1.8rem,4vw,2.8rem)] font-bold bg-gradient-to-r from-blue-400 to-cyan-300 bg-clip-text text-transparent">
                <i class="fa fa-bluetooth-b mr-3"></i>LYWSD03MMC 温湿度监视器
            </h1>
        </header>

        <!-- 控制卡片 -->
        <div class="glass rounded-2xl p-6 mb-6 shadow-xl">
            <div class="flex items-center justify-between flex-wrap gap-4">
                <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-slate-400 text-sm">连接状态：</span>
                    <span id="connStatus" class="text-slate-300">未连接</span>
                    <span id="deviceMac" class="text-slate-500 text-sm"></span>
                </div>
                <div class="flex gap-3">
                    <button id="connectBtn" onclick="connectDevice()" 
                            class="btn-hover bg-primary px-6 py-2.5 rounded-lg font-medium">
                        <i class="fa fa-link mr-2"></i>连接设备
                    </button>
                    <button id="disconnectBtn" onclick="disconnectDevice()" disabled
                            class="btn-hover bg-slate-700 px-6 py-2.5 rounded-lg font-medium disabled:opacity-40 disabled:cursor-not-allowed">
                        <i class="fa fa-unlink mr-2"></i>断开
                    </button>
                </div>
            </div>
        </div>

        <!-- 数据展示卡片组 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <!-- 温度卡片 -->
            <div class="glass rounded-2xl p-6 shadow-lg">
                <div class="flex justify-between items-start mb-4">
                    <h3 class="text-slate-400 font-medium">温度</h3>
                    <i class="fa fa-thermometer-half text-temp text-2xl"></i>
                </div>
                <div class="value-animate">
                    <span id="tempVal" class="text-[clamp(2.2rem,5vw,3.5rem)] font-bold text-temp">--</span>
                    <span class="text-xl text-slate-400"> °C</span>
                </div>
            </div>
            <!-- 湿度卡片 -->
            <div class="glass rounded-2xl p-6 shadow-lg">
                <div class="flex justify-between items-start mb-4">
                    <h3 class="text-slate-400 font-medium">湿度</h3>
                    <i class="fa fa-tint text-humi text-2xl"></i>
                </div>
                <div class="value-animate">
                    <span id="humiVal" class="text-[clamp(2.2rem,5vw,3.5rem)] font-bold text-humi">--</span>
                    <span class="text-xl text-slate-400"> %RH</span>
                </div>
            </div>
            <!-- 电量卡片 -->
            <div class="glass rounded-2xl p-6 shadow-lg">
                <div class="flex justify-between items-start mb-4">
                    <h3 class="text-slate-400">电池电压</h3>
                    <i class="fa fa-battery-full text-battery text-2xl"></i>
                </div>
                <div class="value-animate">
                    <span id="battVal" class="text-[clamp(2.2rem,5vw,3.5rem)] font-bold text-battery">--</span>
                    <span class="text-xl text-slate-400"> mV</span>
                </div>
                <p id="battPercent" class="text-sm text-slate-400 mt-2">电量估算：--%</p>
            </div>
        </div>

        <!-- 温湿度趋势图 -->
        <div class="glass rounded-2xl p-6 shadow-xl mb-6">
            <div class="flex flex-wrap justify-between items-center gap-3 mb-4">
                <h3 class="text-lg font-semibold"><i class="fa fa-line-chart mr-2"></i>温湿度趋势</h3>
                <div class="flex flex-wrap items-center gap-3">
                    <div class="flex items-center gap-2">
                        <label class="text-slate-400 text-sm">显示条数</label>
                        <input id="rangeInput" type="number" min="1" max="500" value="100" onchange="changeRange()" onkeydown="if(event.key==='Enter')changeRange()"
                               class="bg-slate-800 border border-slate-600 rounded-md px-3 py-1.5 text-sm w-24 outline-none focus:border-primary">
                    </div>
                    <button onclick="downloadChart()" class="text-sm text-slate-400 hover:text-white">
                        <i class="fa fa-download mr-1"></i>下载图表
                    </button>
                    <button onclick="clearHistory()" class="text-sm text-slate-400 hover:text-white">清空历史</button>
                </div>
            </div>
            <div class="h-64 md:h-80">
                <canvas id="trendChart"></canvas>
            </div>
        </div>

        <!-- 日志面板 -->
        <div class="glass rounded-2xl p-6 shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold"><i class="fa fa-list-alt mr-2"></i>通讯日志</h3>
                <div class="flex gap-3">
                    <button onclick="exportData()" class="text-sm text-slate-400 hover:text-white">
                        <i class="fa fa-download mr-1"></i>导出数据
                    </button>
                    <button onclick="clearLog()" class="text-sm text-slate-400 hover:text-white">清空日志</button>
                </div>
            </div>
            <div id="logBox" class="bg-slate-900 rounded-lg h-64 overflow-y-auto p-4 text-sm font-mono text-slate-300 space-y-1">
                <div>等待蓝牙设备连接...</div>
            </div>
        </div>
    </div>

    <script>
        // 全局蓝牙变量
        let bluetoothDevice = null;
        let gattServer = null;
        let tempHumChar = null;
        const SERVICE_MI = "ebe0ccb0-7a0a-4b0c-8a1a-6ff2997da3a6";
        const CHAR_TEMP_HUM = "ebe0ccc1-7a0a-4b0c-8a1a-6ff2997da3a6";

        // 历史数据与图表配置
        const MAX_HISTORY = 500;
        const dataHistory = [];
        let trendChart = null;
        let currentRange = 100;

        // DOM元素缓存
        const connStatus = document.getElementById('connStatus');
        const deviceMac = document.getElementById('deviceMac');
        const tempVal = document.getElementById('tempVal');
        const humiVal = document.getElementById('humiVal');
        const battVal = document.getElementById('battVal');
        const battPercent = document.getElementById('battPercent');
        const logBox = document.getElementById('logBox');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const rangeInput = document.getElementById('rangeInput');

        // 初始化折线图
        function initChart() {
            const ctx = document.getElementById('trendChart').getContext('2d');
            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: '温度 (°C)',
                            data: [],
                            borderColor: '#ef4444',
                            backgroundColor: 'rgba(239, 68, 68, 0.1)',
                            tension: 0.3,
                            fill: true,
                            yAxisID: 'y-temp',
                            pointRadius: 2,
                            pointHoverRadius: 4
                        },
                        {
                            label: '湿度 (%RH)',
                            data: [],
                            borderColor: '#0ea5e9',
                            backgroundColor: 'rgba(14, 165, 233, 0.1)',
                            tension: 0.3,
                            fill: true,
                            yAxisID: 'y-humi',
                            pointRadius: 2,
                            pointHoverRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: {
                            labels: {
                                color: '#cbd5e1'
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleColor: '#f1f5f9',
                            bodyColor: '#cbd5e1',
                            borderColor: 'rgba(255,255,255,0.1)',
                            borderWidth: 1
                        }
                    },
                    scales: {
                        x: {
                            ticks: {
                                color: '#94a3b8',
                                maxRotation: 0,
                                autoSkip: true,
                                maxTicksLimit: 8
                            },
                            grid: {
                                color: 'rgba(148, 163, 184, 0.1)'
                            }
                        },
                        'y-temp': {
                            type: 'linear',
                            position: 'left',
                            title: {
                                display: true,
                                text: '温度 (°C)',
                                color: '#ef4444'
                            },
                            ticks: {
                                color: '#94a3b8'
                            },
                            grid: {
                                color: 'rgba(148, 163, 184, 0.1)'
                            }
                        },
                        'y-humi': {
                            type: 'linear',
                            position: 'right',
                            title: {
                                display: true,
                                text: '湿度 (%RH)',
                                color: '#0ea5e9'
                            },
                            ticks: {
                                color: '#94a3b8'
                            },
                            grid: {
                                drawOnChartArea: false
                            }
                        }
                    }
                }
            });
        }

        // 切换显示范围
        function changeRange() {
            let val = parseInt(rangeInput.value);
            if (isNaN(val) || val < 1) {
                val = 1;
                rangeInput.value = 1;
            } else if (val > MAX_HISTORY) {
                val = MAX_HISTORY;
                rangeInput.value = MAX_HISTORY;
            }
            currentRange = val;
            updateChart();
            addLog(`已设置显示最近 ${val} 条数据`);
        }

        // 更新图表数据
        function updateChart() {
            if (!trendChart) return;
            const displayData = dataHistory.slice(-currentRange);
            trendChart.data.labels = displayData.map(item => item.time);
            trendChart.data.datasets[0].data = displayData.map(item => item.temp);
            trendChart.data.datasets[1].data = displayData.map(item => item.hum);
            trendChart.update('none');
        }

        // 下载图表
        function downloadChart() {
            if (!trendChart || dataHistory.length === 0) {
                alert("暂无图表数据可下载");
                return;
            }
            const link = document.createElement('a');
            link.download = `温湿度趋势图_${new Date().toISOString().slice(0,10)}.png`;
            link.href = trendChart.toBase64Image('image/png', 1.0);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            addLog("图表已导出为 PNG 图片");
        }

        // 清空历史数据
        function clearHistory() {
            dataHistory.length = 0;
            updateChart();
            addLog("历史数据与图表已清空");
        }

        // 导出TXT数据
        function exportData() {
            if (dataHistory.length === 0) {
                alert("暂无历史数据可导出，请先连接设备采集数据");
                return;
            }
            
            const exportDataList = dataHistory.slice(-currentRange);
            
            let content = "LYWSD03MMC 温湿度历史数据记录\n";
            content += "导出时间: " + new Date().toLocaleString() + "\n";
            content += `数据范围: 最近 ${exportDataList.length} 条\n`;
            content += "----------------------------------------\n";
            content += "时间\t\t温度(°C)\t湿度(%RH)\t电池(mV)\t电量(%)\n";
            content += "----------------------------------------\n";
            
            exportDataList.forEach(item => {
                content += `${item.time}\t${item.temp}\t\t${item.hum}\t\t${item.vbat}\t\t${item.batPct}\n`;
            });

            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `温湿度数据_${new Date().toISOString().slice(0,10)}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            addLog(`数据已导出为 TXT 文件（共 ${exportDataList.length} 条）`);
        }

        // 日志输出
        function addLog(text) {
            const time = new Date().toLocaleTimeString();
            const line = document.createElement('div');
            line.textContent = `[${time}] ${text}`;
            logBox.appendChild(line);
            logBox.scrollTop = logBox.scrollHeight;
        }
        function clearLog() {
            logBox.innerHTML = '<div>日志已清空</div>';
        }

        // 断开连接
        function disconnectDevice() {
            if(bluetoothDevice && bluetoothDevice.gatt) {
                bluetoothDevice.gatt.disconnect();
            }
            resetState();
            addLog("蓝牙设备已断开");
        }
        function resetState() {
            bluetoothDevice = null;
            gattServer = null;
            tempHumChar = null;
            connStatus.textContent = "未连接";
            deviceMac.textContent = "";
            tempVal.textContent = "--";
            humiVal.textContent = "--";
            battVal.textContent = "--";
            battPercent.textContent = "电量估算：--%";
            connectBtn.disabled = false;
            disconnectBtn.disabled = true;
        }

        // 连接蓝牙设备
        async function connectDevice() {
            try {
                if (!navigator.bluetooth) {
                    alert("当前浏览器不支持Web Bluetooth，请使用Chrome/Edge！");
                    return;
                }
                disconnectDevice();
                const options = {
                    filters: [{ namePrefix: 'LYWSD03' }],
                    optionalServices: [SERVICE_MI]
                };
                addLog("正在搜索蓝牙设备...");
                bluetoothDevice = await navigator.bluetooth.requestDevice(options);
                connStatus.textContent = `已选中: ${bluetoothDevice.name}`;
                bluetoothDevice.addEventListener('gattserverdisconnected', ()=>{
                    addLog("设备主动断开连接");
                    resetState();
                });
                addLog("正在连接GATT服务...");
                gattServer = await bluetoothDevice.gatt.connect();
                deviceMac.textContent = `MAC: ${bluetoothDevice.id || "未知"}`;
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                addLog("GATT连接成功，读取温湿度特征值");
                const miService = await gattServer.getPrimaryService(SERVICE_MI);
                tempHumChar = await miService.getCharacteristic(CHAR_TEMP_HUM);
                await tempHumChar.startNotifications();
                tempHumChar.addEventListener('characteristicvaluechanged', parseSensorData);
                addLog("数据通知已启用，实时接收温湿度");
            } catch(err) {
                addLog(`连接失败: ${err.message}`);
                resetState();
            }
        }

        // 解析传感器数据
        function parseSensorData(event) {
            const data = event.target.value;
            const tempRaw = data.getInt16(0, true);
            const humRaw = data.getUint8(2);
            const vbat = data.getUint16(3, true);
            const temp = (tempRaw / 100).toFixed(1);
            const hum = humRaw;
            let batPct = Math.round(((vbat - 2100) / 1000) * 100);
            batPct = Math.max(0, Math.min(100, batPct));

            // 更新UI
            tempVal.textContent = temp;
            humiVal.textContent = hum;
            battVal.textContent = vbat;
            battPercent.textContent = `电量估算：${batPct}%`;
            
            // 记录历史数据
            const now = new Date();
            const timeStr = now.toLocaleTimeString();
            dataHistory.push({
                time: timeStr,
                temp: temp,
                hum: hum,
                vbat: vbat,
                batPct: batPct
            });
            if (dataHistory.length > MAX_HISTORY) {
                dataHistory.shift();
            }
            updateChart();

            addLog(`温度:${temp}℃ 湿度:${hum}% 电池:${vbat}mV (${batPct}%)`);
        }

        // 页面加载完成后初始化图表
        window.addEventListener('DOMContentLoaded', () => {
            initChart();
        });
    </script>
</body>
</html>
