<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时麦克风监听可视化工具‑修复版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5',
                        secondary: '#06b6d4',
                        dark: '#0f172a',
                        card: '#1e293b',
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glass {
                background: rgba(30, 41, 59, 0.85);
                backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
            .slider-thumb::-webkit-slider-thumb {
                appearance: none;
                width: 18px;
                height: 18px;
                border-radius: 50%;
                background: #4f46e5;
                cursor: pointer;
                border: 2px solid white;
            }
            .slider-track::-webkit-slider-runnable-track {
                height: 6px;
                border-radius: 99px;
                background: rgba(255,255,255,0.15);
            }
            .animate-pulse-slow {
                animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-dark to-slate-900 min-h-screen font-inter text-white p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
        <!-- 标题 -->
        <div class="text-center mb-8">
            <h1 class="text-[clamp(1.8rem,4vw,2.8rem)] font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">
                <i class="fa fa-microphone mr-2"></i>麦克风实时监听可视化
            </h1>
            <p class="text-slate-400 mt-2">收音实时外放｜音量可视化｜音频参数调节</p>
        </div>

        <!-- 主卡片容器 -->
        <div class="glass rounded-2xl p-6 shadow-2xl">
            <!-- 状态行 -->
            <div class="flex flex-wrap items-center justify-between gap-4 mb-6 pb-4 border-b border-slate-700">
                <div class="flex items-center gap-3">
                    <span id="statusDot" class="w-3 h-3 rounded-full bg-red-500"></span>
                    <span id="statusText" class="text-slate-300">未启动监听</span>
                </div>
                <div class="flex gap-3">
                    <select id="audioDeviceSelect" class="bg-slate-800 px-3 py-2 rounded-lg border border-slate-600 text-sm">
                        <option value="">加载麦克风设备...</option>
                    </select>
                    <button id="startBtn" class="bg-primary hover:bg-primary/90 px-5 py-2 rounded-lg transition-all flex items-center gap-2">
                        <i class="fa fa-play"></i> 启动监听
                    </button>
                    <button id="stopBtn" class="bg-red-600 hover:bg-red-700 px-5 py-2 rounded-lg transition-all hidden flex items-center gap-2">
                        <i class="fa fa-stop"></i> 停止监听
                    </button>
                </div>
            </div>

            <!-- 可视化画布区域 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <!-- 波形图 -->
                <div class="bg-slate-900 rounded-xl p-4">
                    <h3 class="text-slate-300 mb-2 text-sm flex items-center gap-2">
                        <i class="fa fa-waveform text-secondary"></i>实时音频波形
                    </h3>
                    <canvas id="waveCanvas" class="w-full h-40 rounded-lg bg-black/40"></canvas>
                </div>
                <!-- 频谱柱状图 -->
                <div class="bg-slate-900 rounded-xl p-4">
                    <h3 class="text-slate-300 mb-2 text-sm flex items-center gap-2">
                        <i class="fa fa-bar-chart text-secondary"></i>音量频谱柱状图
                    </h3>
                    <canvas id="barCanvas" class="w-full h-40 rounded-lg bg-black/40"></canvas>
                </div>
            </div>

            <!-- 实时音量数值展示 -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-slate-900 rounded-xl p-4 text-center">
                    <p class="text-slate-400 text-xs">当前音量</p>
                    <p id="currentVol" class="text-2xl font-bold text-secondary">0.00</p>
                </div>
                <div class="bg-slate-900 rounded-xl p-4 text-center">
                    <p class="text-slate-400 text-xs">音量峰值</p>
                    <p id="peakVol" class="text-2xl font-bold text-orange-400">0.00</p>
                </div>
                <div class="bg-slate-900 rounded-xl p-4 text-center">
                    <p class="text-slate-400 text-xs">采样缓冲区</p>
                    <p id="bufferSize" class="text-2xl font-bold text-green-400">1024</p>
                </div>
                <div class="bg-slate-900 rounded-xl p-4 text-center">
                    <p class="text-slate-400 text-xs">降噪状态</p>
                    <p id="noiseStatus" class="text-2xl font-bold text-slate-500">关闭</p>
                </div>
            </div>

            <!-- 参数调节控制面板 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 左侧滑动调节 -->
                <div class="space-y-5">
                    <!-- 输入增益 -->
                    <div>
                        <div class="flex justify-between text-sm mb-2">
                            <span><i class="fa fa-volume-up text-primary mr-1"></i>输入增益</span>
                            <span id="gainValue">1.0x</span>
                        </div>
                        <input type="range" id="gainSlider" min="0.1" max="5" step="0.1" value="1"
                            class="w-full slider-track slider-thumb">
                    </div>
                    <!-- 输出音量 -->
                    <div>
                        <div class="flex justify-between text-sm mb-2">
                            <span><i class="fa fa-volume-down text-primary mr-1"></i>扬声器输出音量</span>
                            <span id="outputValue">100%</span>
                        </div>
                        <input type="range" id="outputSlider" min="0" max="100" step="1" value="100"
                            class="w-full slider-track slider-thumb">
                    </div>
                    <!-- 左右平衡 -->
                    <div>
                        <div class="flex justify-between text-sm mb-2">
                            <span><i class="fa fa-arrows-h text-primary mr-1"></i>左右声道平衡</span>
                            <span id="panValue">居中</span>
                        </div>
                        <input type="range" id="panSlider" min="-1" max="1" step="0.05" value="0"
                            class="w-full slider-track slider-thumb">
                    </div>
                </div>
                <!-- 右侧高级设置 -->
                <div class="space-y-5">
                    <!-- 缓冲区大小 -->
                    <div>
                        <div class="flex justify-between text-sm mb-2">
                            <span><i class="fa fa-memory text-primary mr-1"></i>音频缓冲区（越小延迟越低）</span>
                            <span id="bufferValue">1024</span>
                        </div>
                        <input type="range" id="bufferSlider" min="256" max="4096" step="256" value="1024"
                            class="w-full slider-track slider-thumb">
                    </div>
                    <!-- 降噪开关 -->
                    <div class="flex items-center justify-between bg-slate-900 p-3 rounded-lg">
                        <span class="text-sm"><i class="fa fa-filter text-primary mr-1"></i>噪声抑制（系统降噪）</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="noiseReduceSwitch" class="sr-only peer">
                            <div class="w-10 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-primary"></div>
                        </label>
                    </div>
                    <!-- 重置参数按钮 -->
                    <button id="resetParamBtn" class="w-full bg-slate-700 hover:bg-slate-600 py-2.5 rounded-lg transition-all mt-2">
                        <i class="fa fa-refresh mr-2"></i>重置全部音频参数
                    </button>
                </div>
            </div>
        </div>

        <!-- 底部提示 -->
        <div class="mt-6 text-center text-slate-500 text-sm">
            <p>⚠️ 浏览器需授予麦克风权限，外放音量过大会产生啸叫，建议佩戴耳机使用</p>
        </div>
    </div>

    <script>
        // 全局音频变量
        let audioCtx = null;
        let mediaStream = null;
        let sourceNode = null;
        let gainNode = null;
        let panNode = null;
        let analyserWave = null;
        let analyserBar = null;
        let animationId = null;
        let peakVolume = 0;
        const BUFFER_COUNT = 2048;

        // DOM元素
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const audioDeviceSelect = document.getElementById('audioDeviceSelect');
        const waveCanvas = document.getElementById('waveCanvas');
        const barCanvas = document.getElementById('barCanvas');
        const waveCtx = waveCanvas.getContext('2d');
        const barCtx = barCanvas.getContext('2d');
        const currentVolEl = document.getElementById('currentVol');
        const peakVolEl = document.getElementById('peakVol');
        const bufferSizeEl = document.getElementById('bufferSize');
        const noiseStatusEl = document.getElementById('noiseStatus');

        // 滑块控件
        const gainSlider = document.getElementById('gainSlider');
        const gainValue = document.getElementById('gainValue');
        const outputSlider = document.getElementById('outputSlider');
        const outputValue = document.getElementById('outputValue');
        const panSlider = document.getElementById('panSlider');
        const panValue = document.getElementById('panValue');
        const bufferSlider = document.getElementById('bufferSlider');
        const bufferValue = document.getElementById('bufferValue');
        const noiseReduceSwitch = document.getElementById('noiseReduceSwitch');
        const resetParamBtn = document.getElementById('resetParamBtn');

        // 画布自适应
        function resizeCanvas() {
            waveCanvas.width = waveCanvas.offsetWidth * window.devicePixelRatio;
            waveCanvas.height = waveCanvas.offsetHeight * window.devicePixelRatio;
            barCanvas.width = barCanvas.offsetWidth * window.devicePixelRatio;
            barCanvas.height = barCanvas.offsetHeight * window.devicePixelRatio;
            waveCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
            barCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 获取麦克风设备列表
        async function getAudioDevices() {
            try {
                await navigator.mediaDevices.getUserMedia({audio: true});
                const devices = await navigator.mediaDevices.enumerateDevices();
                audioDeviceSelect.innerHTML = '';
                devices.forEach(device => {
                    if (device.kind === 'audioinput') {
                        const opt = document.createElement('option');
                        opt.value = device.deviceId;
                        opt.textContent = device.label || `麦克风 ${audioDeviceSelect.children.length + 1}`;
                        audioDeviceSelect.appendChild(opt);
                    }
                });
            }catch (e){
                statusText.innerText = "麦克风权限禁止，请浏览器开启麦克风";
            }
        }

        // 更新状态显示
        function setStatus(isRunning) {
            if(isRunning) {
                statusDot.className = 'w-3 h-3 rounded-full bg-green-500 animate-pulse-slow';
                statusText.textContent = '监听运行中';
                startBtn.classList.add('hidden');
                stopBtn.classList.remove('hidden');
            } else {
                statusDot.className = 'w-3 h-3 rounded-full bg-red-500';
                statusText.textContent = '未启动监听';
                startBtn.classList.remove('hidden');
                stopBtn.classList.add('hidden');
                cancelAnimationFrame(animationId);
            }
        }

        // 绘制波形图
        function drawWaveform(dataArray, width, height) {
            waveCtx.clearRect(0,0,width,height);
            waveCtx.lineWidth = 2;
            waveCtx.strokeStyle = '#06b6d4';
            waveCtx.beginPath();
            const sliceWidth = width / dataArray.length;
            let x = 0;
            for(let i=0; i<dataArray.length; i++) {
                const v = dataArray[i] / 128.0;
                const y = v * height / 2;
                if(i === 0) waveCtx.moveTo(x, y);
                else waveCtx.lineTo(x, y);
                x += sliceWidth;
            }
            waveCtx.lineTo(width, height/2);
            waveCtx.stroke();
        }

        // 绘制频谱柱状图
        function drawBar(dataArray, width, height) {
            barCtx.clearRect(0,0,width,height);
            const barWidth = width / dataArray.length * 2.5;
            let x = 0;
            for(let i=0; i<dataArray.length; i++) {
                const barHeight = dataArray[i] / 255 * height;
                const hue = i / dataArray.length * 180 + 120;
                barCtx.fillStyle = `hsl(${hue},80%,55%)`;
                barCtx.fillRect(x, height - barHeight, barWidth, barHeight);
                x += barWidth + 1;
            }
        }

        // 音频渲染循环
        function renderLoop() {
            animationId = requestAnimationFrame(renderLoop);
            if(!analyserWave || !analyserBar) return;
            const width = waveCanvas.offsetWidth;
            const height = waveCanvas.offsetHeight;
            const barW = barCanvas.offsetWidth;
            const barH = barCanvas.offsetHeight;

            // 波形数据
            const waveData = new Uint8Array(analyserWave.frequencyBinCount);
            analyserWave.getByteTimeDomainData(waveData);
            drawWaveform(waveData, width, height);

            // 频谱数据
            const barData = new Uint8Array(analyserBar.frequencyBinCount);
            analyserBar.getByteFrequencyData(barData);
            drawBar(barData, barW, barH);

            // 计算实时音量
            let sum = 0;
            for(let val of barData) sum += val;
            const avgVol = (sum / barData.length / 255).toFixed(2);
            currentVolEl.textContent = avgVol;
            if(parseFloat(avgVol) > peakVolume) peakVolume = parseFloat(avgVol);
            peakVolEl.textContent = peakVolume.toFixed(2);
        }

        // 启动麦克风监听
        async function startListen() {
            const deviceId = audioDeviceSelect.value;
            const bufferSize = parseInt(bufferSlider.value);
            const audioConstraints = {
                audio: {
                    deviceId: deviceId ? {exact: deviceId} : undefined,
                    noiseSuppression: noiseReduceSwitch.checked,
                    echoCancellation: true,
                    channelCount: 2
                }
            };

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia(audioConstraints);
                audioCtx = new (window.AudioContext || window.webkitAudioContext)({
                    latencyHint: bufferSize / 44100
                });
                bufferSizeEl.textContent = bufferSize;

                // 音频节点创建
                sourceNode = audioCtx.createMediaStreamSource(mediaStream);
                gainNode = audioCtx.createGain();
                panNode = audioCtx.createStereoPanner();
                analyserWave = audioCtx.createAnalyser();
                analyserBar = audioCtx.createAnalyser();

                analyserWave.fftSize = BUFFER_COUNT;
                analyserBar.fftSize = BUFFER_COUNT;

                // 参数初始化
                gainNode.gain.value = parseFloat(gainSlider.value);
                audioCtx.destination.gain.value = outputSlider.value / 100;
                panNode.pan.value = parseFloat(panSlider.value);

                // 音频链路：麦克风 -> 增益 -> 平衡 -> 分析器 -> 扬声器
                sourceNode.connect(gainNode);
                gainNode.connect(panNode);
                panNode.connect(analyserWave);
                panNode.connect(analyserBar);
                panNode.connect(audioCtx.destination);

                setStatus(true);
                renderLoop();
                noiseStatusEl.textContent = noiseReduceSwitch.checked ? '开启' : '关闭';
            } catch(err) {
                alert('麦克风权限获取失败：' + err.message + "\n请在浏览器设置开启麦克风权限");
                console.error(err);
                stopListen();
            }
        }

        // 停止监听
        function stopListen() {
            if(mediaStream) mediaStream.getTracks().forEach(track => track.stop());
            if(audioCtx) audioCtx.close();
            mediaStream = null;
            audioCtx = null;
            sourceNode=null;
            gainNode=null;
            panNode=null;
            analyserWave=null;
            analyserBar=null;
            peakVolume = 0;
            currentVolEl.textContent = '0.00';
            peakVolEl.textContent = '0.00';
            noiseStatusEl.textContent = '关闭';
            setStatus(false);
            waveCtx.clearRect(0,0,waveCanvas.width,waveCanvas.height);
            barCtx.clearRect(0,0,barCanvas.width,barCanvas.height);
        }

        // 滑块事件绑定（增加空对象判断，杜绝报错）
        gainSlider.addEventListener('input', () => {
            const val = parseFloat(gainSlider.value);
            gainValue.textContent = val.toFixed(1) + 'x';
            if(gainNode) gainNode.gain.value = val;
        });
        outputSlider.addEventListener('input', () => {
            const val = outputSlider.value;
            outputValue.textContent = val + '%';
            if(audioCtx) audioCtx.destination.gain.value = val / 100;
        });
        panSlider.addEventListener('input', () => {
            const val = parseFloat(panSlider.value);
            if(val < -0.05) panValue.textContent = `左 ${Math.abs(val).toFixed(2)}`;
            else if(val > 0.05) panValue.textContent = `右 ${val.toFixed(2)}`;
            else panValue.textContent = '居中';
            if(panNode) panNode.pan.value = val;
        });
        bufferSlider.addEventListener('input', () => {
            bufferValue.textContent = bufferSlider.value;
            bufferSizeEl.textContent = bufferSlider.value;
        });
        noiseReduceSwitch.addEventListener('change', () => {
            noiseStatusEl.textContent = noiseReduceSwitch.checked ? '开启' : '关闭';
            if(audioCtx){
                stopListen();
                startListen();
            }
        });

        // 重置参数
        resetParamBtn.addEventListener('click', () => {
            gainSlider.value = 1;
            gainValue.textContent = '1.0x';
            outputSlider.value = 100;
            outputValue.textContent = '100%';
            panSlider.value = 0;
            panValue.textContent = '居中';
            bufferSlider.value = 1024;
            bufferValue.textContent = '1024';
            noiseReduceSwitch.checked = false;
            noiseStatusEl.textContent = '关闭';
            if(gainNode) gainNode.gain.value = 1;
            if(audioCtx) audioCtx.destination.gain.value = 1;
            if(panNode) panNode.pan.value = 0;
        });

        // 启停按钮
        startBtn.addEventListener('click', startListen);
        stopBtn.addEventListener('click', stopListen);

        // 页面加载获取设备
        window.addEventListener('DOMContentLoaded', getAudioDevices);
        // 页面关闭销毁音频
        window.addEventListener('beforeunload', stopListen);
    </script>
</body>
</html>
